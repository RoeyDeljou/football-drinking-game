# Local Postgres for apps/api — required for `npm run dev` (apps/api) and for `npm test` (the API
# integration suite provisions a throwaway schema inside this same database per test run; see
# apps/api/tests/helpers.ts). Production uses a separate, Render-managed Postgres instance — this
# container is local-only.
#
# Usage:
#   docker compose up -d
#   # apps/api/.env.example already points DATABASE_URL at this instance by default.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fdg
      POSTGRES_PASSWORD: fdg
      POSTGRES_DB: fdg
    ports:
      - '5432:5432'
    volumes:
      - fdg_postgres_data:/var/lib/postgresql/data

volumes:
  fdg_postgres_data:
